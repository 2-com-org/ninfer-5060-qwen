# /etc/wsl.conf of the ninfer-5060-qwen distribution that the Windows package installs. It runs
# only the server, as root, without systemd. Windows' PATH stays out of Linux's: the launcher calls
# no Windows programs from inside, and its directories (such as "Program Files (x86)") only slow
# command lookup. WSL itself adds /usr/lib/wsl/lib, the Windows driver's libcuda, to the loader's
# search path.
[boot]
systemd=false

[user]
default=root

[interop]
appendWindowsPath=false
