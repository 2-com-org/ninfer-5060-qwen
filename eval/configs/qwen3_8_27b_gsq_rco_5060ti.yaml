schema_version: 1

# Qwen3.8-27B GSQ-RCO IQ3_XXS on one RTX 5060 Ti 16 GB: the text suite of
# qwen3_8_27b_gsq_rco_reasoning.yaml plus LiveCodeBench v6. Sampling, budgets and judging are
# unchanged: Qwen's thinking-mode settings, rule judging.
#
# Each suite runs against its own server, started with --concurrency equal to the suite's job
# concurrency and a 262,144-token context (scripts/qwen38/serve.sh --port 18080 --local-only
# --concurrency N). A request reserves its prompt plus its whole output budget in the KV pool,
# 263-265K tokens at two or three requests, so the budget sets how many run at once:
#   ifbench        3 x (283-token prompt + 65,536)
#   aime           2 x (prompt + 122,880)
#   gpqa           1 x (2,847-token prompt + 245,760)
#   livecodebench  2 x (prompt + 122,880)
# A server whose pool holds fewer queues the rest under admission; nothing is truncated.

targets:
  qwen38_api:
    protocol: openai_chat
    base_url: http://127.0.0.1:18080/v1
    model: qwen3.8-27b
    max_concurrency: 3
    request:
      timeout_seconds: 86400
      retries: 2
      retry_interval_seconds: 10

suites:
  ifbench:
    jobs:
      - id: ifbench
        backend: evalscope
        dataset: ifbench
        target: qwen38_api
        max_concurrency: 3
        generation:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          presence_penalty: 0.0
          frequency_penalty: 0.0
          max_tokens: 65536
          seed: 42
          extra_body: &thinking_extra_body
            enable_thinking: true
            min_p: 0.0
        backend_args:
          few_shot_num: 0
          judge_strategy: rule
          dataset_hub: modelscope

  aime:
    jobs:
      - id: aime25
        backend: evalscope
        dataset: aime25
        target: qwen38_api
        max_concurrency: 2
        generation: &aime_generation
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          presence_penalty: 0.0
          frequency_penalty: 0.0
          max_tokens: 122880
          seed: 42
          extra_body: *thinking_extra_body
        backend_args: &aime_backend
          judge_strategy: rule
          dataset_hub: modelscope

      - id: aime26
        backend: evalscope
        dataset: aime26
        target: qwen38_api
        max_concurrency: 2
        generation: *aime_generation
        backend_args: *aime_backend

  gpqa:
    jobs:
      - id: gpqa_diamond
        backend: evalscope
        dataset: gpqa_diamond
        target: qwen38_api
        max_concurrency: 1
        generation:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          presence_penalty: 0.0
          frequency_penalty: 0.0
          # A 245,760-token budget plus the 2,847-token prompt fits the 262,144-token context.
          max_tokens: 245760
          seed: 42
          extra_body: *thinking_extra_body
        backend_args:
          few_shot_num: 0
          judge_strategy: rule
          dataset_hub: modelscope

  # LiveCodeBench v6 as Qwen's model cards name it ("v6", problems from 2025-02 to 2025-05; the
  # Qwen3.8 card states no window). Generated code runs only in EvalScope's Docker sandbox: without
  # a Docker daemon the responses are kept and every sample is reported failed and unscored.
  livecodebench:
    jobs:
      - id: livecodebench_v6
        backend: evalscope
        dataset: live_code_bench
        target: qwen38_api
        max_concurrency: 2
        generation: *aime_generation
        backend_args:
          subset_list: [release_v6]
          dataset_args:
            extra_params:
              start_date: "2025-02-01"
              end_date: "2025-05-01"
          sandbox: true
          dataset_hub: modelscope

runtime:
  max_parallel_jobs: 1
  runs_dir: eval/runs
  progress:
    enabled: true
    refresh_seconds: 1
    heartbeat_seconds: 900
  samples:
    retention: all
